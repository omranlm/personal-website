  /* "try it" instruction callout */
  .hint {
    margin: 14px 24px 0; display: flex; gap: 14px; align-items: center;
    padding: 12px 16px; border-radius: 10px; border: 1px solid var(--teal); border-inline-start: 6px solid var(--teal);

    animation: glow 2.4s ease-in-out infinite;
  }
  [dir="rtl"] .hint { background: linear-gradient(270deg, var(--teal-t), #ffffff 85%); }
  .hint .ico { font-size: 26px; animation: bounce 1.6s ease-in-out infinite; }
  .hint strong { color: var(--teal); }
  .hint .tag {
    display: inline-block; background: var(--red); color: #fff; font-size: 11px; font-weight: 700;
    padding: 1px 8px; border-radius: 999px; margin-inline-end: 6px; letter-spacing: .3px;
  }
  .hint.used { animation: none; }
  .hint.used .ico { animation: none; }
  @keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(0,134,115,.35); } 50% { box-shadow: 0 0 0 9px rgba(0,134,115,0); } }

  #start { border: 2px solid var(--teal); font-weight: 600; }
  #start.pulse { animation: ring 1.6s ease-out infinite; }

  .bar .shift { font-size: 13px; padding: 5px 9px; }

  /* key dates */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 24px 10px; }
  .chip {
    background: var(--grey-t); border-radius: 999px; padding: 5px 13px; font-size: 13px; color: var(--slate);

    0% { background: var(--red); color: #fff; transform: scale(1.1); }
    40% { background: var(--teal); color: #fff; transform: scale(1.04); }
    100% { background: var(--grey-t); transform: scale(1); }
  }
  .chip.flash b { animation: chipflashb 1.1s ease-out; }
  @keyframes chipflashb { 0%, 40% { color: #fff; } 100% { color: var(--charcoal); } }

  @media (max-width: 600px) {

<script>
const C = { teal:'#008673', slate:'#404E5E', charcoal:'#21232A', red:'#C1272C', grey:'#CFD2D6',

const T = {
  en: {
    dir:'ltr', other:'العربية',
    title:'Phase 1 Training – Tracks and Schedule',
    sub:'Damage Assessment and Recovery Department · 10 trainees · 19 training days · Al-Awad & Nabo Trading and Contracting Company',

    hint:'<span class="tag">TRY IT</span><strong>Change the Day 1 date</strong> with the date picker, or use <strong>−1 week / +1 week</strong>. The whole training schedule moves on the calendar: training days, reserve days, acceptance and the final report. Weekends (Friday and Saturday) are skipped automatically, and the new dates flash below.',

    pathway:'Training pathway', timeline:'Timeline by training day',
    sel:'Selection test', selSub:'15–20 candidates → 10', selWhen:'within 5 days of signing',

    start:'تاريخ اليوم الأول:',
    hint:'<span class="tag">جرّبها</span><strong>غيّر تاريخ اليوم الأول</strong> من منتقي التاريخ، أو استخدم <strong>−أسبوع / +أسبوع</strong>. سيتحرك جدول التدريب كله على التقويم: أيام التدريب والأيام الاحتياطية والاستلام والتقرير النهائي. تُتخطى العطلة (الجمعة والسبت) تلقائياً، وتومض التواريخ الجديدة أدناه.',
    wkMinus:'−أسبوع', wkPlus:'+أسبوع', reset:'إعادة (8 تشرين الثاني)',

    note:'أسبوع العمل: 5 أيام، والعطلة: يومان. يُتوقع أن يبدأ اليوم الأول في 8 تشرين الثاني 2026 (± أسبوع). الكتل المخططة أيام ميدانية. ◆ تشير إلى بوابة المستوى (اختبار الخروج). مرّر المؤشر فوق أي كتلة لعرض التفاصيل. لمشاركة الصفحة بالعربية أضف <code dir="ltr">?lang=ar</code> إلى الرابط (<code dir="ltr">?lang=en</code> للإنكليزية)، ويُحفظ تاريخ البدء المختار في الرابط أيضاً.',

    lanes:['نظم المعلومات الجغرافية · الجميع','الطائرات المسيّرة · المجموعة أ','الطائرات المسيّرة · المجموعة ب','الختام'],
    basic:'أساسي', beginner:'مبتدئ', inter:'متوسط',
    venue:'القاعة التدريبية', field:'الميدان', venueField:'القاعة + تمرين ميداني قريب', fieldVenue:'يومان ميدان + يوم قاعة',

// Schedule (Temp details B.3). lane: 0 GIS, 1 drones A, 2 drones B, 3 closing; span: lanes covered

  ...[1,2].map((d,i)=>({day:d,lane:0,track:'gis',lvl:'basic',loc:'venue',grp:'all',ld:`${i+1} / 2`,gate:i===1&&'gb'})),

  {day:15,lane:2,track:'dr',lvl:'inter',loc:'field',grp:'grpB',ld:'1 / 3'},
  {day:16,lane:1,track:'dr',lvl:'inter',loc:'field',grp:'grpA',ld:'2 / 3'},
  {day:17,lane:2,track:'dr',lvl:'inter',loc:'field',grp:'grpB',ld:'2 / 3'},
  {day:18,lane:1,track:'dr',lvl:'inter',loc:'venue',grp:'grpA',ld:'3 / 3',gate:'di'},

const CLOSING = [
  {from:20,to:22,key:'reserve',tip:'reserveTip',fill:C.grey,ink:C.charcoal},

// Language and start date come from the link: ?lang=ar|en&start=YYYY-MM-DD
const DEFAULT_START = '2026-11-08';
const params = new URLSearchParams(location.search);
let lang = (params.get('lang') || '').toLowerCase().startsWith('ar') ? 'ar' : 'en';
const startEl = document.getElementById('start');
if (/^\d{4}-\d{2}-\d{2}$/.test(params.get('start') || '')) startEl.value = params.get('start');

const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), tip = document.getElementById('tip');
let W = 1100, H = 640, hits = [], flashAt = 0;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const isWeekend = d => d.getDay() === 5 || d.getDay() === 6;
function dayDate(n) {
  // Day n counts working days (Sun–Thu); Fri and Sat are the weekend
  const d = new Date(startEl.value + 'T00:00:00');
  if (isNaN(d)) return null;
  while (isWeekend(d)) d.setDate(d.getDate() + 1);
  let k = 1;
  while (k < n) { d.setDate(d.getDate() + 1); if (!isWeekend(d)) k++; }
  return d;
}

// Flash wave: each day column lights up in turn after the date changes (0..1)
function flashAlpha(n) {
  if (!flashAt) return 0;
  const e = performance.now() - flashAt - n * 25;
  return e < 0 || e > 900 ? 0 : Math.sin(Math.PI * e / 900);
}

// ---- RTL-aware drawing helpers: all layout is computed left-to-right, then mirrored for Arabic
const rtl = () => T[lang].dir === 'rtl';
const mx = (x, w = 0) => rtl() ? W - x - w : x;
function rrect(x, y, w, h, r, fill, stroke) {
  x = mx(x, w);
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1.5; ctx.stroke(); }
}
function hatch(x, y, w, h, r, color) {
  x = mx(x, w);
  ctx.save(); ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.clip();
  ctx.strokeStyle = color; ctx.lineWidth = 2;
  for (let i = -h; i < w + h; i += 7) { ctx.beginPath(); ctx.moveTo(x + i, y + h); ctx.lineTo(x + i + h, y); ctx.stroke(); }
  ctx.restore();
}
function text(s, x, y, { size = 13, weight = 400, color = C.charcoal, align = 'start', base = 'middle', maxW, ltr = false } = {}) {
  ctx.font = `${weight} ${size}px "Segoe UI", Tahoma, Arial, sans-serif`;
  ctx.fillStyle = color; ctx.textBaseline = base;
  ctx.direction = rtl() && !ltr ? 'rtl' : 'ltr';
  const map = { start: rtl() ? 'right' : 'left', end: rtl() ? 'left' : 'right', center: 'center' };
  ctx.textAlign = map[align];
  ctx.fillText(s, mx(x), y, maxW);
}
function diamond(x, y, s, fill) {
  x = mx(x);
  ctx.beginPath(); ctx.moveTo(x, y - s); ctx.lineTo(x + s, y); ctx.lineTo(x, y + s); ctx.lineTo(x - s, y); ctx.closePath();
  ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = C.white; ctx.lineWidth = 1.5; ctx.stroke();
}
function arrow(x1, y1, x2, y2, color = C.muted) {
  x1 = mx(x1); x2 = mx(x2);
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  const a = Math.atan2(y2 - y1, x2 - x1);
  ctx.beginPath(); ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - 8 * Math.cos(a - 0.45), y2 - 8 * Math.sin(a - 0.45));
  ctx.lineTo(x2 - 8 * Math.cos(a + 0.45), y2 - 8 * Math.sin(a + 0.45));
  ctx.closePath(); ctx.fill();
}
function hit(x, y, w, h, html) { hits.push({ x: mx(x, w), y, w, h, html }); }

function colorsFor(e) {
  if (e.track === 'gis') return { fill: C.teal, ink: C.white, hatch: e.loc === 'venueField' ? 'rgba(255,255,255,.35)' : null };
  if (e.loc === 'field') return { fill: C.slate, ink: C.white, hatch: 'rgba(255,255,255,.22)' };
  return { fill: C.slateT, ink: C.charcoal, hatch: null };
}

// ---- Pathway (top): selection → GIS levels → drone levels → acceptance
function drawPathway(t, top) {
  text(t.pathway, 0, top + 8, { size: 15, weight: 600 });
  const y1 = top + 34, y2 = top + 128, bh = 64;
  const gap = 34, selW = 150;
  const boxW = (W - selW - gap * 4) / 3;
  // selection
  rrect(0, y1, selW, bh, 8, C.red);
  text(t.sel, selW / 2, y1 + 18, { size: 14, weight: 600, color: C.white, align: 'center', maxW: selW - 12 });
  text(t.selSub, selW / 2, y1 + 37, { size: 12, color: C.white, align: 'center', maxW: selW - 12 });
  text(t.selWhen, selW / 2, y1 + 53, { size: 11, color: '#ffd9da', align: 'center', maxW: selW - 12 });
  hit(0, y1, selW, bh, `<b>${t.sel}</b><br>${t.selTip}<br>${t.selWhen}`);

  const lv = [
    { k: 'basic', gis: [2, 'venue', 'gb'], dr: [2, 'venue', 'db', 'both'] },
    { k: 'beginner', gis: [2, 'venue', 'gbe'], dr: [2, 'field', 'dbe', 'pg'] },
    { k: 'inter', gis: [3, 'venueField', 'gi'], dr: [3, 'fieldVenue', 'di', 'pg'] },
  ];
  const x0 = selW + gap;
  arrow(selW + 2, y1 + bh / 2, x0 - 4, y1 + bh / 2, C.red);
  lv.forEach((l, i) => {
    const x = x0 + i * (boxW + gap);
    // GIS
    rrect(x, y1, boxW, bh, 8, C.teal);
    text(`${t.gis} · ${t[l.k]}`, x + 12, y1 + 20, { size: 13, weight: 600, color: C.white, maxW: boxW - 24 });
    text(`${t.days(l.gis[0])} · ${t[l.gis[1]]}`, x + 12, y1 + 42, { size: 12, color: '#e6f4f1', maxW: boxW - 24 });
    hit(x, y1, boxW, bh, `<b>${t.gis} – ${t[l.k]}</b><br>${t.days(l.gis[0])} · ${t[l.gis[1]]}<br>${t.gate}: ${t.gates[l.gis[2]]}`);
    // Drones
    const field = l.dr[1] !== 'venue';
    rrect(x, y2, boxW, bh, 8, field ? C.slate : C.slateT);
    if (field) hatch(x, y2, boxW * (l.dr[1] === 'field' ? 1 : 0.66), bh, 8, 'rgba(255,255,255,.18)');
    const ink = field ? C.white : C.charcoal;
    text(`${t.dr} · ${t[l.k]}`, x + 12, y2 + 20, { size: 13, weight: 600, color: ink, maxW: boxW - 24 });
    const dTxt = `${t.days(l.dr[0])}${l.dr[3] === 'pg' ? t.perGroup : ''} · ${t[l.dr[1]]}`;
    text(dTxt, x + 12, y2 + 42, { size: 12, color: field ? '#e3e7eb' : C.slate, maxW: boxW - 24 });
    hit(x, y2, boxW, bh, `<b>${t.dr} – ${t[l.k]}</b><br>${dTxt}<br>${l.dr[3] === 'both' ? t.both : t.grpA + ' / ' + t.grpB}<br>${t.gate}: ${t.gates[l.dr[2]]}`);
    // gates and arrows
    if (i < 2) {
      const gx = x + boxW + gap / 2;
      arrow(x + boxW + 2, y1 + bh / 2, x + boxW + gap - 4, y1 + bh / 2, C.teal);
      arrow(x + boxW + 2, y2 + bh / 2, x + boxW + gap - 4, y2 + bh / 2, C.slate);
      diamond(gx, y1 + bh / 2, 6, C.charcoal);
      diamond(gx, y2 + bh / 2, 6, C.charcoal);
    }
  });
  // GIS Intermediate → Drone Basic
  const lastX = x0 + 2 * (boxW + gap);
  ctx.strokeStyle = C.muted; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]);
  ctx.beginPath();
  ctx.moveTo(mx(lastX + boxW / 2), y1 + bh); ctx.lineTo(mx(lastX + boxW / 2), y1 + bh + 15);
  ctx.lineTo(mx(x0 + boxW / 2), y1 + bh + 15); ctx.stroke(); ctx.setLineDash([]);
  arrow(x0 + boxW / 2, y1 + bh + 14, x0 + boxW / 2, y2 - 3);
  diamond(lastX + boxW / 2, y1 + bh + 15, 6, C.charcoal);
  return y2 + bh;
}

// ---- Timeline (bottom): a real calendar, Sunday to Saturday, with the weekend shown as holiday columns
function buildColumns(avail, x0) {
  const d1 = dayDate(1) || new Date(DEFAULT_START + 'T00:00:00');
  const gridStart = new Date(d1); gridStart.setDate(d1.getDate() - d1.getDay());   // Sunday of Day 1's week
  const gridEnd = new Date(dayDate(28) || d1); gridEnd.setDate(gridEnd.getDate() + (6 - gridEnd.getDay())); // Saturday
  const cols = [], byDay = {};
  let n = 0;
  for (const d = new Date(gridStart); d <= gridEnd; d.setDate(d.getDate() + 1)) {
    const we = isWeekend(d);
    if (!we && d >= d1) n++;
    cols.push({ date: new Date(d), we, n: !we && d >= d1 ? n : 0 });
  }
  const weeks = cols.length / 7, weRatio = 0.8;
  const cw = avail / (weeks * (5 + 2 * weRatio));
  let x = x0;
  cols.forEach((c, i) => { c.i = i; c.x = x; c.w = c.we ? cw * weRatio : cw; x += c.w; if (c.n) byDay[c.n] = c; });
  return { cols, byDay, weeks, cw };
}

function drawTimeline(t, top) {
  text(t.timeline, 0, top + 8, { size: 15, weight: 600 });
  const labW = Math.min(200, W * 0.2), preW = 54;
  const { cols, byDay, weeks, cw } = buildColumns(W - labW - preW - 8, labW + preW + 8);
  // header rows: week · weekday name · training day number · date
  const hTop = top + 30, yWd = hTop + 33, yNum = hTop + 48, yDate = hTop + 63;
  const laneTop = hTop + 74, laneH = 46, lanes = 4;
  const bottom = laneTop + lanes * laneH;

  // week headers
  for (let w = 0; w < weeks; w++) {
    const a = cols[w * 7], b = cols[w * 7 + 6];
    rrect(a.x, hTop, b.x + b.w - a.x - 2, 20, 4, C.greyT);
    text(`${t.week} ${w + 1}`, (a.x + b.x + b.w) / 2, hTop + 10, { size: 12, weight: 600, color: C.slate, align: 'center' });
  }
  // lane backgrounds and labels
  t.lanes.forEach((name, i) => {
    const y = laneTop + i * laneH;
    if (i % 2 === 0) rrect(0, y, labW + preW, laneH, 0, '#fafbfb');
    ctx.fillStyle = '#e6e8eb'; ctx.fillRect(0, y + laneH - 1, W, 1);
    text(name, 6, y + laneH / 2, { size: 12.5, weight: 600, color: i === 0 ? C.teal : i < 3 ? C.slate : C.charcoal, maxW: labW - 10 });
  });
  // day columns
  cols.forEach(c => {
    const a = flashAlpha(c.i), d = c.date, cx = c.x + c.w / 2;
    if (c.we) {
      rrect(c.x, hTop + 24, c.w, bottom - hTop - 24, 0, C.wkd);
      hatch(c.x, laneTop, c.w, lanes * laneH, 0, 'rgba(193,39,44,.10)');
      hit(c.x, hTop + 24, c.w, bottom - hTop - 24, `<b>${t.fmt(d)}</b><br>${t.weekendTip}`);
    } else if (!c.n) {
      rrect(c.x, hTop + 24, c.w, bottom - hTop - 24, 0, C.greyT);
      text('–', cx, yNum, { size: 12, color: C.muted, align: 'center' });
      hit(c.x, hTop + 24, c.w, bottom - hTop - 24, `<b>${t.fmt(d)}</b><br>${t.beforeTip}`);
    } else {
      text(String(c.n), cx, yNum, { size: 12, weight: 600, align: 'center' });
    }
    text(t.wd(d), cx, yWd, { size: 9.5, weight: 600, color: c.we ? C.red : C.slate, align: 'center', maxW: c.w - 2 });
    if (a > 0) {
      // highlighted column sweeping across the calendar
      ctx.globalAlpha = a * 0.16; rrect(c.x + 1, laneTop, c.w - 2, lanes * laneH, 0, C.teal); ctx.globalAlpha = 1;
      ctx.globalAlpha = a; rrect(c.x + 1, yDate - 8, c.w - 2, 16, 4, c.we || c.n === 1 || c.n === 28 ? C.red : C.teal); ctx.globalAlpha = 1;
    }
    const lit = a > 0.3;
    // narrow weekend columns show the day of the month only
    text(c.w < 36 ? String(d.getDate()) : t.fmtS(d), cx, yDate, { size: 9.5, weight: lit ? 700 : 400, color: lit ? C.white : c.we ? C.red : C.muted, align: 'center', maxW: c.w - 2 });
    ctx.fillStyle = '#e6e8eb'; ctx.fillRect(mx(c.x, 1), laneTop, 1, lanes * laneH);
  });
  // vertical "weekend" label across each Friday–Saturday pair
  for (let w = 0; w < weeks; w++) {
    const f = cols[w * 7 + 5], s = cols[w * 7 + 6];
    const cx = mx((f.x + s.x + s.w) / 2), cy = laneTop + (lanes * laneH) / 2;
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(-Math.PI / 2);
    ctx.font = '600 11px "Segoe UI", Tahoma, Arial, sans-serif'; ctx.fillStyle = C.red;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.direction = rtl() ? 'rtl' : 'ltr';
    ctx.fillText(t.weekend, 0, 0, lanes * laneH - 10);
    ctx.restore();
  }
  // selection test (before Day 1)
  const sx = labW + 4, sy = laneTop + 6;
  rrect(sx, sy, preW - 8, laneH - 12, 6, C.red);
  text('T', sx + (preW - 8) / 2, sy + (laneH - 12) / 2, { size: 13, weight: 700, color: C.white, align: 'center' });
  hit(sx, sy, preW - 8, laneH - 12, `<b>${t.sel}</b><br>${t.selTip}<br>${t.selWhen}`);

  // training days
  SCHEDULE.forEach(e => {
    const c = byDay[e.day]; if (!c) return;
    const x = c.x + 2, y = laneTop + e.lane * laneH + 6;
    const w = c.w - 4, h = (e.span || 1) * laneH - 12;
    const col = colorsFor(e);
    const a = flashAlpha(c.i);
    if (a > 0) { ctx.globalAlpha = a; rrect(x - 3, y - 3, w + 6, h + 6, 7, null, C.red); ctx.globalAlpha = 1; }
    rrect(x, y, w, h, 5, col.fill);
    if (col.hatch) hatch(x, y, w, h, 5, col.hatch);
    const short = { basic: t.basic, beginner: t.beginner, inter: t.inter }[e.lvl];
    ctx.save(); ctx.beginPath(); ctx.rect(mx(x, w), y, w, h); ctx.clip();
    text(lang === 'ar' || cw > 46 ? short : short.slice(0, 3), x + w / 2, y + h / 2 - 6, { size: 10.5, weight: 600, color: col.ink, align: 'center', maxW: w - 4 });
    text(e.ld, x + w / 2, y + h / 2 + 8, { size: 10, color: col.ink, align: 'center', maxW: w - 4, ltr: true });
    ctx.restore();
    if (e.gate) diamond(x + w, y + h / 2, 5.5, C.charcoal);
    const trackName = e.track === 'gis' ? t.gis : t.dr;
    hit(x, y, w, h,
      `<b>${t.day} ${e.day} · ${t.fmt(c.date)}</b><br>${trackName} – ${short}<br>` +
      `${t.level}: ${e.ld}<br>${t.group}: ${t[e.grp]}<br>${t.loc}: ${t[e.loc]}` +
      (e.gate ? `<br>◆ ${t.gate}: ${t.gates[e.gate]}` : ''));
  });

  // closing items; a span that crosses a weekend is split into runs of consecutive working days
  CLOSING.forEach(c => {
    const runs = [];
    for (let n = c.from; n <= c.to; n++) {
      const col = byDay[n]; if (!col) continue;
      const r = runs[runs.length - 1];
      if (r && r.b.i === col.i - 1) r.b = col; else runs.push({ a: col, b: col });
    }
    if (!runs.length) return;
    const big = runs.reduce((m, r) => (r.b.x + r.b.w - r.a.x > m.b.x + m.b.w - m.a.x ? r : m));
    const d1 = dayDate(c.from), d2 = dayDate(c.to);
    const range = c.from === c.to ? `${t.day} ${c.from}` : `${t.day} ${c.from}–${c.to}`;
    runs.forEach(r => {
      const x = r.a.x + 2, w = r.b.x + r.b.w - x - 2, y = laneTop + 3 * laneH + 6, h = laneH - 12;
      const a = flashAlpha(r.a.i);
      if (a > 0) { ctx.globalAlpha = a; rrect(x - 3, y - 3, w + 6, h + 6, 7, null, C.red); ctx.globalAlpha = 1; }
      rrect(x, y, w, h, 5, c.fill, c.outline);
      if (c.key === 'reserve') hatch(x, y, w, h, 5, 'rgba(255,255,255,.5)');
      if (c.from === c.to) {
        // single-day marker: label sits in the free days before it
        text('✓', x + w / 2, y + h / 2, { size: 13, weight: 700, color: c.ink, align: 'center' });
        text(t[c.key], x - 6, y + h / 2, { size: 11, weight: 600, color: c.ink, align: 'end' });
      } else if (r === big) {
        ctx.font = '600 11px "Segoe UI", Tahoma, Arial, sans-serif';
        const label = ctx.measureText(t[c.key]).width > w - 4 && lang === 'en' ? t[c.key].slice(0, 3) + '.' : t[c.key];
        text(label, x + w / 2, y + h / 2, { size: 11, weight: 600, color: c.ink, align: 'center', maxW: w - 4 });
      }
      hit(x, y, w, h, `<b>${range}${d1 ? ' · ' + t.fmtS(d1) + (c.from !== c.to ? ' – ' + t.fmtS(d2) : '') : ''}</b><br>${t[c.tip]}`);
    });
  });
  return bottom;
}

function draw() {
  const t = T[lang];
  const wrapW = document.querySelector('.wrap').clientWidth - 48;
  W = Math.max(940, wrapW);
  const dpr = window.devicePixelRatio || 1;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  hits = [];
  const end = drawTimeline(t, drawPathway(t, 4) + 34);
  if (Math.abs(end + 10 - H) > 1) { H = end + 10; return draw(); }
}

function renderChips(flash) {
  const t = T[lang];
  document.getElementById('chips').innerHTML = t.chips.map(([cls, label, n], i) => {
    const d = dayDate(n);
    return `<span class="chip ${cls} ${flash ? 'flash' : ''}" style="animation-delay:${i * 90}ms">${label}<b>${d ? t.fmt(d) : '–'}</b></span>`;
  }).join('');
  if (flash) document.querySelectorAll('.chip b').forEach((b, i) => b.style.animationDelay = `${i * 90}ms`);
}

function syncUrl() {
  // keep ?lang= and ?start= in the link so it can be shared as is
  try {
    const u = new URL(location.href);
    u.searchParams.set('lang', lang);
    if (startEl.value) u.searchParams.set('start', startEl.value);
    history.replaceState(null, '', u);
  } catch (e) { /* some browsers block this on file:// links */ }
}

let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.dir = T[lang].dir; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
}

function animate() {
  draw();
  if (flashAt && performance.now() - flashAt < 50 * 25 + 950) requestAnimationFrame(animate);
  else { flashAt = 0; draw(); }
}

function onDateChange() {
  const t = T[lang], d1 = dayDate(1);
  if (!d1) return;
  const picked = new Date(startEl.value + 'T00:00:00');
  document.getElementById('hint').classList.add('used');
  startEl.classList.remove('pulse');
  renderChips(!reduceMotion);
  showToast(t.toast(t.fmt(d1), t.fmt(dayDate(28))) + (isWeekend(picked) ? t.snapped : ''));
  syncUrl();
  if (reduceMotion) return draw();
  flashAt = performance.now(); requestAnimationFrame(animate);
}

function shiftStart(days) {
  const d = new Date((startEl.value || DEFAULT_START) + 'T00:00:00');
  d.setDate(d.getDate() + days);
  const p = v => String(v).padStart(2, '0');
  startEl.value = `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  onDateChange();
}

function applyLang() {
  const t = T[lang];
  document.documentElement.lang = lang; document.documentElement.dir = t.dir;
  document.getElementById('t-title').textContent = t.title;
  document.getElementById('t-sub').textContent = t.sub;
  document.getElementById('t-about-h').textContent = t.aboutH;
  document.getElementById('t-about').innerHTML = t.about;
  document.getElementById('t-start').textContent = t.start;
  document.getElementById('t-hint').innerHTML = t.hint;
  document.getElementById('wk-minus').textContent = t.wkMinus;
  document.getElementById('wk-plus').textContent = t.wkPlus;
  document.getElementById('reset').textContent = t.reset;
  document.getElementById('t-note').innerHTML = t.note;
  document.querySelectorAll('.lang-switch button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  renderChips(false);
  syncUrl();
  document.getElementById('legend').innerHTML = t.legend.map(([c, l]) => {
    const bg = c === 'slate' ? `repeating-linear-gradient(135deg, ${C.slate} 0 4px, #59667480 4px 7px)` : C[c];
    return `<span><i class="sw" style="background:${bg}"></i>${l}</span>`;
  }).join('') + `<span>◆ ${t.gate}</span>`;
  draw();
}

cv.addEventListener('mousemove', ev => {
  const r = cv.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  const h = hits.find(b => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h);
  cv.style.cursor = h ? 'pointer' : 'default';
  if (!h) { tip.style.display = 'none'; return; }
  tip.innerHTML = h.html; tip.dir = T[lang].dir; tip.style.display = 'block';
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.left = Math.min(ev.clientX + 14, innerWidth - tw - 8) + 'px';
  tip.style.top = (ev.clientY + 16 + th > innerHeight ? ev.clientY - th - 10 : ev.clientY + 16) + 'px';
});
cv.addEventListener('mouseleave', () => tip.style.display = 'none');
document.querySelectorAll('.lang-switch button').forEach(b => b.onclick = () => { if (lang !== b.dataset.lang) { lang = b.dataset.lang; applyLang(); } });
startEl.addEventListener('change', onDateChange);
document.getElementById('wk-minus').onclick = () => shiftStart(-7);
document.getElementById('wk-plus').onclick = () => shiftStart(7);
document.getElementById('reset').onclick = () => { startEl.value = DEFAULT_START; onDateChange(); };
addEventListener('resize', draw);
applyLang();
// one welcome sweep so the reader sees that the calendar is live
if (!reduceMotion) setTimeout(() => { flashAt = performance.now(); requestAnimationFrame(animate); }, 700);
</script>
<script src="/cookie-consent.js"></script>
</body>
