<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Douma 3D Model — Drone Survey December 2025</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0e0c0b;
      color: #e0d8d0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── top bar ── */
    .top-bar {
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .75rem 1.25rem;
      background: linear-gradient(to bottom, rgba(14,12,11,.85) 0%, transparent 100%);
      pointer-events: none;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      background: rgba(12, 124, 112, 0.85);
      color: #fff;
      border: none;
      border-radius: 20px;
      padding: .4rem .9rem;
      font-size: .82rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      pointer-events: all;
      transition: background .15s;
      backdrop-filter: blur(6px);
    }
    .back-btn:hover { background: rgba(0, 101, 96, 0.95); }
    .back-btn svg { flex-shrink: 0; }

    .title-block {
      text-align: right;
    }
    .title-block h1 {
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
    }
    .title-block p {
      font-size: .72rem;
      color: rgba(255,255,255,.5);
      margin-top: .15rem;
    }

    /* ── model viewer ── */
    model-viewer {
      width: 100%;
      flex: 1;
      --poster-color: #0e0c0b;
      --progress-bar-color: #0c7c70;
      --progress-mask: transparent;
    }

    /* ── bottom hint ── */
    .hint {
      position: absolute;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: .5rem;
      background: rgba(14,12,11,.7);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 20px;
      padding: .35rem .9rem;
      font-size: .75rem;
      color: rgba(255,255,255,.55);
      pointer-events: none;
      animation: fadeout 4s 3s forwards;
    }
    @keyframes fadeout { to { opacity: 0; } }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="douma-mapping.html" class="back-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back to Douma Mapping
    </a>
    <div class="title-block">
      <h1>Douma, Syria — 3D Model</h1>
      <p>Drone survey · December 2025 · 3 cm resolution</p>
    </div>
  </div>

  <model-viewer
    id="model"
    alt="3D model of Douma, Syria — drone survey December 2025"
    camera-controls
    auto-rotate
    auto-rotate-delay="2000"
    rotation-per-second="8deg"
    shadow-intensity="1"
    shadow-softness="0.8"
    exposure="1.1"
    environment-image="neutral"
    interaction-prompt="none"
    loading="eager"
  ></model-viewer>

  <div class="hint">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
    Drag to rotate · Scroll to zoom · Right-drag to pan
  </div>

  <script>
    document.getElementById('model').src = window.location.protocol === 'file:'
      ? 'https://najjar.biz/assets/odm_textured_model_geo.glb'
      : '../assets/odm_textured_model_geo.glb';
  </script>
</body>
</html>
